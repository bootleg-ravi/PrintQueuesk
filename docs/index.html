<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintQueuesk - Upload</title>
    <link rel="icon" href="img/tab-icon.ico">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="img/logo.png" alt="PrintQueuesk Logo" class="logo">
        </header>

        <!-- Error Message Banner -->
        <div class="error-message" id="error-message" style="display: none;">
            <svg class="error-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            <span id="error-text">Error message here</span>
        </div>

        <!-- Upload Form -->
        <form id="uploadForm">
            <div id="drop-zone">
                <div class="drop-zone-text">Upload Your File</div>
                <div class="drop-zone-subtext">Files accepted are PDF and DOCX (Max 50MB)</div>
                <label class="file-label" for="file">Select files</label>
                <input type="file" id="file" accept=".pdf,.docx">
            </div>

            <!-- Progress Tracking UI -->
            <div id="progress-container">
                <div class="progress-item">
                    <div id="file-thumb">
                        <svg id="file-thumb-icon" viewBox="0 0 24 24"><path fill="#666" d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                    </div>
                    <div class="file-info">
                        <span id="file-name">filename.pdf</span>
                        <div id="file-size">0.0 MB</div>
                        <div class="progress-wrapper">
                            <div class="progress-bar-container">
                                <div id="progress-bar"></div>
                            </div>
                            <div class="progress-controls">
                                <span id="progress-label">0%</span>
                                <button id="remove-file-btn" type="button" aria-label="Remove file">
                                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <button type="submit" disabled>Submit</button>
        </form>
        
        <!-- Interactive Guide Section -->
        <div class="guide-section">
            <details>
                <summary>Step-by-step guide <span class="arrow">▶</span></summary>
                <div class="guide-content">
                    <img src="img/1.png" alt="Users Guide" style="width:100%; margin-top:10px; border-radius:8px;">
                    <img src="img/6.png" alt="Upload Step" style="width:100%; margin-top:10px; border-radius:8px;">
                    <img src="img/7.png" alt="Pay Step" style="width:100%; margin-top:10px; border-radius:8px;">
                    <img src="img/8.png" alt="Collect Step" style="width:100%; margin-top:10px; border-radius:8px;">
                    <img src="img/2.jpg" alt="Accepted Currency" style="width:100%; margin-top:10px; border-radius:8px;">
                    <img src="img/3.png" alt="Important Notice" style="width:100%; margin-top:10px; border-radius:8px;">
                    <img src="img/4.png" alt="Format Notice" style="width:100%; margin-top:10px; border-radius:8px;">
                </div>
            </details>
        </div>
    </div>

    <!-- Links to the Firebase upload logic -->
    <script type="module" src="js/hotspot.js"></script>
</body>
</html>
